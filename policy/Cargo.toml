[package]
name = "skylot-policy"
version = "0.1.0"
edition = "2021"
description = "Transaction-scope Lattice validity policy for the Skylot city chain"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
# no_std with no native panic handler: only the unit tests build natively.
doctest = false

[dependencies]
lattice-policy-rules = { git = "https://github.com/adalinxx/moniker", tag = "v0.1.0" }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
